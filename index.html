<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramica OpenStreetMap-Wikidata Italia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- CORE LAYOUT --- */
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        /* --- HEADER --- */
        #header { background-color: #333; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; height: 50px; z-index: 3000; position: relative; }
        #left-col { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        #menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 5px; }
        #title { font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #cat-toggle-btn { display: none; background: #e67e22; border: none; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; margin-left: 10px; }
        #cat-toggle-btn:hover { background: #d35400; }
        
        #controls { display: none; gap: 8px; align-items: center; font-size: 12px; margin-left: auto; flex-shrink: 0; padding-right: 5px; }
        #meta-info { font-size: 10px; color: #ccc; text-align: right; border-left: 1px solid #555; padding-left: 10px; min-width: 90px; display: block; margin-left: auto; margin-right: 5px;}
        
        /* --- PLACEHOLDER --- */
        #map-placeholder { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 500; background: rgba(0,0,0,0.7); color: white; padding: 15px 25px; border-radius: 30px; }
        .desktop-msg { display: inline; }
        .mobile-msg { display: none; }

        /* --- SIDEBAR --- */
        #sidebar { width: 220px; background-color: #2c3e50; color: #ecf0f1; border-right: 1px solid #1a252f; flex-shrink: 0; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        #sidebar-content { flex-grow: 1; overflow-y: auto; overflow-x: hidden; }
        #sidebar-footer { padding: 12px; font-size: 10px; text-align: center; color: #7f8c8d; border-top: 1px solid #34495e; background-color: #233140; flex-shrink: 0; }

        #main-container { display: flex; flex: 1; width: 100%; position: relative; overflow: hidden; }
        #map { flex-grow: 1; background: #f0f0f0; height: 100%; }

        /* REGION STYLING EFFECTS */
        .region-hovered { weight: 3px !important; color: blue !important; }
        .region-clicked { weight:  real; transition-ease-important}    
    </style>
</head>
<body>
    <div id="header">
        <div id="left-col">
            <button id="menu-toggle">☰</button>
            <a id="title" href="#">OpenStreetMap-Wikidata Italia</a>
            <button id="cat-toggle-btn">Toggle Categories</button>
        </div>
        <div id="controls"></div>
        <div id="meta-info"></div>
    </div>
    <div id="main-container">
        <div id="map"></div>
        <div id="sidebar">
            <div id="sidebar-content"></div>
            <div id="sidebar-footer">Footer Content</div>
        </div>
    </div>
    <div id="map-placeholder">
        <div class="desktop-msg">Loading...</div>
        <div class="mobile-msg">Please use a larger screen</div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Add your map JavaScript code here
    </script>
</body>
</html>
