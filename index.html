<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramica OpenStreetMap-Wikidata Italia</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* --- CORE LAYOUT --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        #header {
            background-color: #333;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            height: 50px;
            z-index: 3000;
            position: relative;
            flex-shrink: 0;
        }

        #left-col {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 0;
        }

        #menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 5px;
        }

        #title {
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #cat-toggle-btn {
            display: none;
            background: #e67e22;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        #cat-toggle-btn:hover {
            background: #d35400;
        }

        #controls {
            display: none;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            margin-left: auto;
            flex-shrink: 0;
            padding-right: 5px;
        }

        #meta-info {
            font-size: 10px;
            color: #ccc;
            text-align: right;
            border-left: 1px solid #555;
            padding-left: 10px;
            min-width: 90px;
            display: block;
            margin-left: auto;
            margin-right: 5px;
        }

        /* --- PLACEHOLDER --- */
        #map-placeholder {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 500;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }

        .desktop-msg { display: inline; }
        .mobile-msg  { display: none; }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: #ecf0f1;
            border-right: 1px solid #1a252f;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #sidebar-content {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #sidebar-footer {
            padding: 12px;
            font-size: 10px;
            text-align: center;
            color: #7f8c8d;
            border-top: 1px solid #34495e;
            background-color: #233140;
            flex-shrink: 0;
        }

        #main-container {
            display: flex;
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        #map {
            flex-grow: 1;
            background: #f0f0f0;
            height: 100%;
        }

        /* List Item (Regions) */
        .list-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: background 0.2s;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            background-color: #34495e;
        }

        /* --- ACCORDION STYLES --- */
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            border-bottom: 1px solid #2c3e50;
            font-size: 13px;
            background-color: #34495e;
            transition: background 0.2s;
        }

        .group-header.fully-selected {
            background-color: #2980b9 !important;
            border-left: 4px solid #fff;
        }

        .group-header.partially-selected {
            border-left: 4px solid #f39c12;
            background-color: #3e5871;
        }

        .group-label {
            flex-grow: 1;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .group-label:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .group-toggle-icon {
            padding: 10px;
            cursor: pointer;
            border-left: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
        }

        .group-toggle-icon:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .group-content {
            display: none;
            background-color: #2c3e50;
        }

        .group-content.expanded {
            display: block;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            #menu-toggle { display: block; }
            #sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 2000;
                transform: translateX(-100%);
                width: 250px;
                box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            #title { display: none; }
            .desktop-msg { display: none; }
            .mobile-msg  { display: inline; }
            .leaflet-control-zoom { display: none !important; }
        }
    </style>
</head>

<body>
<header id="header">
    <div id="left-col">
        <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div id="title" onclick="location.reload()">Panoramica OpenStreetMap-Wikidata Italia</div>
        <button id="cat-toggle-btn" onclick="location.reload()">Torna a panoramica</button>
    </div>
</header>

<div id="main-container">
    <div id="sidebar">
        <div id="sidebar-content"></div>
        <div id="sidebar-footer">Panoramica a cura di: Michael Wild</div>
    </div>

    <div id="map">
        <div id="map-placeholder">
            <span class="desktop-msg">Seleziona una regione</span>
            <span class="mobile-msg">↖ Toccare il menu (☰) per scegliere una regione</span>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
