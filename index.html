<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramica OpenStreetMap-Wikidata Italia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* HEADER */
        #header { background-color: #333; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; height: 50px; z-index: 1000; position: relative; }
        
        #left-col { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        #menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 5px; }
        #title { font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* TOGGLE BUTTON */
        #cat-toggle-btn { 
            display: none; 
            background: #e67e22; border: none; color: white; 
            padding: 5px 10px; border-radius: 4px; font-weight: bold; 
            cursor: pointer; font-size: 12px; margin-left: 10px; white-space: nowrap;
            flex-shrink: 0; 
        }
        #cat-toggle-btn:hover { background: #d35400; }
        #cat-toggle-btn.active { background: #c0392b; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }

        /* CONTROLS - Startseite versteckt */
        #controls { display: none; gap: 8px; align-items: center; font-size: 12px; margin-left: auto; flex-shrink: 0; padding-right: 5px; }
        
        /* SIDEBAR */
        #sidebar { width: 220px; background-color: #2c3e50; color: #ecf0f1; border-right: 1px solid #1a252f; flex-shrink: 0; transition: transform 0.3s ease; display: flex; flex-direction: column; height: 100%; overflow-y: auto; }
        
        /* MAIN LAYOUT */
        #main-container { display: flex; height: calc(100vh - 50px); width: 100%; position: relative; overflow: hidden; }
        #map { flex-grow: 1; background: #f0f0f0; height: 100%; }
        
        .list-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #34495e; transition: background 0.2s; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .list-item:hover { background-color: #34495e; }
        .list-item.active { background-color: #3498db; font-weight: bold; border-left: 4px solid #fff; }
        
        /* CATEGORY ITEM STYLE */
        .cat-item { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .cat-info { display: flex; align-items: center; gap: 5px; overflow: hidden; pointer-events: none; }
        .cat-dot { min-width: 10px; width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
        .cat-dl-btn { background: none; border: 1px solid #7f8c8d; color: #bdc3c7; border-radius: 3px; cursor: pointer; font-size: 12px; padding: 2px 6px; z-index: 10; }
        .cat-dl-btn:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }

        .stat-item { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
        .dot-red { background: #e74c3c; }
        .dot-green { background: #2ecc71; }
        
        .btn-download { 
            background-color: #bdc3c7; color: #333; border: 1px solid #95a5a6; 
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; 
            display: none; 
        }
        .btn-download:hover { background-color: #aab7b8; }
        
        #meta-info { font-size: 9px; color: #ccc; text-align: right; border-left: 1px solid #555; padding-left: 10px; min-width: 80px; }
        #loading { display:none; color: #f1c40f; font-weight: bold; font-size: 11px; }
        
        /* LOGOS IN POPUP */
        .logo-row { display: flex; gap: 15px; margin-top: 8px; justify-content: center; align-items: center; }
        .logo-link { display: inline-block; width: 32px; height: 32px; transition: transform 0.2s; }
        .logo-link:hover { transform: scale(1.1); }
        .logo-link img { width: 100%; height: 100%; object-fit: contain; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 700px) {
            #menu-toggle { display: block; }
            #sidebar { 
                position: absolute; left: 0; top: 0; bottom: 0; z-index: 2000; 
                transform: translateX(-100%); width: 250px; box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            }
            #sidebar.open { transform: translateX(0); }
            
            /* Titolo nascosto su mobile */
            #title { display: none; }
            #cat-toggle-btn { font-size: 11px; padding: 4px 8px; margin-left: 0; }
            #controls { gap: 5px; }
            
            /* Text labels hidden on mobile controls */
            .stat-item span:nth-child(3) { display: none; } 
            #meta-info { display: none; }
        }
    </style>
</head>
<body>
<header id="header">
    <div id="left-col">
        <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div id="title" onclick="location.reload()">Panoramica OpenStreetMap-Wikidata Italia</div>
        <button id="cat-toggle-btn" onclick="toggleViewMode()">Vista Categorie</button>
    </div>
    <div id="controls">
        <div id="loading">Loading...</div>
        <div class="stat-item" id="stat-missing" onclick="toggleCheckbox('chkMissing')" title="Solo Wikidata">
            <span class="dot dot-red"></span><input type="checkbox" id="chkMissing" checked onchange="toggleLayer('missing', this.checked)"> <span>Solo Wikidata</span> <span id="count-missing" style="font-weight:bold"></span>
        </div>
        <button id="btnDownload" class="btn-download" onclick="downloadCurrentMissing()" title="Scarica selezione">⬇</button>
        <div class="stat-item" id="stat-done" onclick="toggleCheckbox('chkDone')" title="OSM+Wikidata">
            <span class="dot dot-green"></span><input type="checkbox" id="chkDone" onchange="toggleLayer('done', this.checked)"> <span>OSM+Wikidata</span> <span id="count-done" style="font-weight:bold"></span>
        </div>
        <div id="meta-info">
            <div>OSM: <span id="date-osm">--</span></div>
            <div>WD: <span id="date-wiki">--</span></div>
        </div>
    </div>
</header>
<div id="main-container">
    <div id="sidebar"></div>
    <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([42.0, 12.5], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        maxZoom: 19,
        attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
    }).addTo(map);

    map.createPane('regionsPane'); map.getPane('regionsPane').style.zIndex = 400;
    map.createPane('markersPane'); map.getPane('markersPane').style.zIndex = 600;

    var layers = { missing: L.layerGroup(), done: L.layerGroup(), regions: L.layerGroup(), activeBorder: L.layerGroup() };
    var regionConfig, metaDataGlobal, boundariesGeoJSON;
    var currentMissingFeatures = [];
    var currentData = null; 
    
    // STATE
    var viewMode = 'regions'; 
    var selectedRegionKey = null;
    var activeCategoryFilters = new Set(); // MULTI-SELECT

    // --- 30 KATEGORIEN + LOCALITÀ ---
    var categoryColors = {
        "chiesa": "#FF0000", "insediamento": "#0000FF", "frazione": "#008000", "cimitero": "#808080",
        "palazzo_comunale": "#FFA500", "municipality_seat": "#FFD700", "biblio_pubblica": "#00CED1",
        "cappella": "#800080", "nuraghe": "#8B4513", "oratorio": "#FF69B4", "villa": "#4B0082",
        "casa": "#A52A2A", "natura_2000": "#32CD32", "struttura_arch": "#708090", "palazzo": "#DC143C",
        "cascina": "#D2691E", "edificio": "#C0C0C0", "pianta_monum": "#006400", "archivio": "#4682B4",
        "palazzo_italiano": "#B22222", "castello": "#800000", "montagna": "#2F4F4F",
        "biblio_spec": "#20B2AA", "biblio_univ": "#5F9EA0", "capitello": "#DA70D6", "torre": "#000080",
        "museo": "#DDA0DD", "biblio_privata": "#BC8F8F", "strada_urbana": "#696969",
        "biblio_scolastica": "#F0E68C", 
        "localita": "#A0522D", // LOCALITÀ
        "other": "#000000"
    };

    var categoryLabels = {
        "chiesa": "Chiesa", "insediamento": "Insediamento Umano", "frazione": "Frazione", "cimitero": "Cimitero",
        "palazzo_comunale": "Palazzo Comunale", "municipality_seat": "Sede Municipio", "biblio_pubblica": "Biblioteca Pubblica",
        "cappella": "Cappella", "nuraghe": "Nuraghe", "oratorio": "Oratorio", "villa": "Villa",
        "casa": "Casa", "natura_2000": "Natura 2000", "struttura_arch": "Struttura Arch.", "palazzo": "Palazzo",
        "cascina": "Cascina", "edificio": "Edificio", "pianta_monum": "Pianta Monumentale", "archivio": "Archivio",
        "palazzo_italiano": "Palazzo Italiano", "castello": "Castello", "montagna": "Montagna",
        "biblio_spec": "Biblio. Specializzata", "biblio_univ": "Biblio. Universitaria", "capitello": "Capitello Votivo",
        "torre": "Torre", "museo": "Museo", "biblio_privata": "Biblio. Privata", "strada_urbana": "Strada Urbana",
        "biblio_scolastica": "Biblio. Scolastica", 
        "localita": "Località", 
        "other": "Altro"
    };

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // --- FIX MOBILE SPERRE ---
    // Auf Mobile macht ein Klick auf die leere Karte (nicht Region) nichts,
    // um versehentliches Schließen der Sidebar zu verhindern.
    map.on('click', function() {
        // Nur auf Desktop schließt Klick auf Hintergrund die Sidebar
        if (window.innerWidth > 700) {
            document.getElementById('sidebar').classList.remove('open');
        }
    });

    Promise.all([
        fetch('regions.json').then(r => r.json()),
        fetch('metadata.json').then(r => r.json()).catch(() => ({})),
        fetch('regions_boundaries.geojson').then(r => r.json()).catch(() => null)
    ]).then(([regions, metadata, bounds]) => {
        regionConfig = regions; metaDataGlobal = metadata; boundariesGeoJSON = bounds;
        
        if(metadata.global_osm_date) {
             let d = new Date(metadata.global_osm_date);
             document.getElementById('date-osm').innerText = !isNaN(d) ? d.toLocaleString() + " CET" : metadata.global_osm_date;
        }
        if(metadata.global_wiki_date) {
             let d = new Date(metadata.global_wiki_date);
             document.getElementById('date-wiki').innerText = !isNaN(d) ? d.toLocaleString() + " CET" : metadata.global_wiki_date;
        }

        renderSidebar();
        if (boundariesGeoJSON) loadRegionsShape();
    });

    function getHeatColor(p) {
        if (p >= 90) return '#006400';
        if (p >= 80) return '#228B22';
        if (p >= 70) return '#32CD32';
        if (p >= 60) return '#ADFF2F';
        if (p >= 50) return '#FFFF00';
        if (p >= 40) return '#FFA500';
        if (p >= 30) return '#FF8C00';
        if (p >= 20) return '#FF4500';
        if (p >= 10) return '#FF0000';
        return '#8B0000';
    }

    function toggleViewMode() {
        viewMode = (viewMode === 'regions') ? 'categories' : 'regions';
        var btn = document.getElementById('cat-toggle-btn');
        btn.innerText = (viewMode === 'categories') ? "Torna a Regioni" : "Vista Categorie";
        if(viewMode === 'categories') btn.classList.add('active'); else btn.classList.remove('active');
        
        activeCategoryFilters.clear();
        
        renderSidebar();
        if (currentData) renderMarkers(currentData);
    }
    
    // --- MULTI-SELECT LOGIC ---
    function toggleCategoryFilter(cat) {
        if (activeCategoryFilters.has(cat)) {
            activeCategoryFilters.delete(cat);
        } else {
            activeCategoryFilters.add(cat);
        }
        renderSidebar(); // Update UI highlights
        renderMarkers(currentData); // Filter map
    }

    function renderSidebar() {
        var sb = document.getElementById('sidebar'); sb.innerHTML = "";
        
        if (viewMode === 'regions') {
            var sortedKeys = Object.keys(regionConfig).sort((a,b) => {
                var metaA = (metaDataGlobal.regions && metaDataGlobal.regions[a]) || {done:0, total:1};
                var metaB = (metaDataGlobal.regions && metaDataGlobal.regions[b]) || {done:0, total:1};
                var pctA = (metaA.done / metaA.total);
                var pctB = (metaB.done / metaB.total);
                if (pctB !== pctA) return pctB - pctA;
                return regionConfig[a].name.localeCompare(regionConfig[b].name);
            });

            sortedKeys.forEach(key => {
                var meta = (metaDataGlobal.regions && metaDataGlobal.regions[key]) ? metaDataGlobal.regions[key] : null;
                var pct = (meta && meta.total > 0) ? Math.round((meta.done / meta.total) * 100) : null;
                var color = pct !== null ? getHeatColor(pct) : "#fff";
                
                var div = document.createElement('div');
                div.className = "list-item"; 
                if (key === selectedRegionKey) div.classList.add('active');
                div.innerHTML = `<span>${regionConfig[key].name}</span>` + (pct !== null ? `<span style="color:${color};font-weight:bold">${pct}%</span>` : "");
                div.onclick = () => { changeRegion(key); if(window.innerWidth<=700) toggleSidebar(); };
                sb.appendChild(div);
            });
        } 
        else {
            if (!currentData) {
                sb.innerHTML = "<div style='padding:10px;color:orange'>Seleziona prima una regione!</div>";
                return;
            }
            
            var missing = currentData.features.filter(f => f.properties.status === 'missing');
            var totalMissing = missing.length;
            var counts = {};
            
            Object.keys(categoryColors).forEach(k => counts[k] = 0);
            
            missing.forEach(f => {
                var cat = f.properties.category || 'other';
                if(counts[cat] !== undefined) counts[cat]++; else counts['other']++;
            });

            var sortedCats = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);

            sortedCats.forEach(cat => {
                if (counts[cat] === 0) return;

                var percent = (totalMissing > 0) ? ((counts[cat] / totalMissing) * 100).toFixed(1) : 0;
                
                var div = document.createElement('div');
                div.className = "list-item";
                
                // Highlight logic for multi-select
                if (activeCategoryFilters.has(cat)) {
                    div.style.backgroundColor = "#2980b9"; 
                    div.style.borderLeft = "4px solid white";
                }
                
                div.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        toggleCategoryFilter(cat);
                    }
                };
                
                div.innerHTML = `
                    <div class="cat-item">
                        <div class="cat-info">
                            <span class="cat-dot" style="background:${categoryColors[cat]}"></span>
                            <span>${categoryLabels[cat] || cat}</span>
                            <small style="color:#aaa;margin-left:4px"> ${percent}% (${counts[cat]})</small>
                        </div>
                        <button class="cat-dl-btn" onclick="downloadCategory('${cat}')" title="Scarica JSON">⬇</button>
                    </div>
                `;
                sb.appendChild(div);
            });
        }
    }

    function getKeyFromFeature(f) {
        var id = String(f.id || f.properties.id || f.properties['@id'] || "").replace("relation/", "");
        var found = Object.keys(regionConfig).find(k => String(parseInt(regionConfig[k].osm) - 3600000000) === id);
        if (found) return found;
        var name = f.properties.name || f.properties['name:en'] || "";
        if (name.includes("Sardegna") || name.includes("Sardinia")) return "sardegna";
        return null;
    }

    function loadRegionsShape() {
        L.geoJSON(boundariesGeoJSON, {
            pane: 'regionsPane',
            style: function(f) {
                var k = getKeyFromFeature(f);
                var color = "#3498db", opacity = 0.1;
                if (k && metaDataGlobal.regions && metaDataGlobal.regions[k]) {
                    var m = metaDataGlobal.regions[k];
                    if (m.total > 0) { color = getHeatColor((m.done / m.total) * 100); opacity = 0.6; }
                }
                return { color: color, weight: 1.5, fillOpacity: opacity };
            },
            onEachFeature: (f, l) => { 
                var k = getKeyFromFeature(f); 
                if (k) { 
                    l.on('click', (e) => { 
                        // --- FIX MOBILE NAVIGATION ---
                        // Auf Mobile ist das Tippen auf die Karte verboten für Navigation
                        if (window.innerWidth <= 700) {
                            L.DomEvent.stopPropagation(e);
                            return; // Abbruch, keine Aktion
                        }
                        
                        L.DomEvent.stopPropagation(e);
                        changeRegion(k); 
                    }); 
                    l.bindTooltip(regionConfig[k].name, {direction: "center", className: "region-label"}); 
                }
            }
        }).addTo(layers.regions);
        map.addLayer(layers.regions);
    }

    function changeRegion(key) {
        selectedRegionKey = key;
        
        viewMode = 'regions'; 
        activeCategoryFilters.clear(); 
        
        document.getElementById('cat-toggle-btn').innerText = "Vista Categorie";
        document.getElementById('cat-toggle-btn').classList.remove('active');
        document.getElementById('cat-toggle-btn').style.display = 'block'; 
        
        // SHOW CONTROLS NOW
        document.getElementById('controls').style.display = 'flex';

        renderSidebar(); 
        
        // Auto-Open Sidebar on Mobile if triggered (via menu/list)
        if(window.innerWidth <= 700) document.getElementById('sidebar').classList.add('open');

        layers.activeBorder.clearLayers();
        var target = boundariesGeoJSON.features.find(f => getKeyFromFeature(f) === key);
        if(target) {
            var b = L.geoJSON(target, { 
                pane: 'regionsPane', 
                style: { color: "#3498db", weight: 3, fillOpacity: 0.05 } 
            }).addTo(layers.activeBorder);
            map.addLayer(layers.activeBorder); map.fitBounds(b.getBounds());
        }
        document.getElementById('loading').style.display = 'block';
        document.getElementById('btnDownload').style.display = 'none';
        
        fetch(`data_overpass/data_${key}.geojson`).then(res => res.json()).then(data => {
            currentData = data; 
            renderMarkers(data);
            document.getElementById('loading').style.display = 'none';
        });
    }

    function renderMarkers(data) {
        layers.missing.clearLayers(); layers.done.clearLayers();
        currentMissingFeatures = [];

        var cM = 0, cD = 0;
        data.features.forEach(f => {
            var isD = f.properties.status === 'done';
            var cat = f.properties.category || 'other';

            // MULTI-SELECT FILTER LOGIC
            if (activeCategoryFilters.size > 0) {
                if (!isD && !activeCategoryFilters.has(cat)) return; // Skip unmatched missing items
            }

            if(isD) {
                cD++;
            } else {
                cM++;
                currentMissingFeatures.push(f);
            }

            var p = f.properties;
            // FIX POPUP LABEL (Name first)
            var pop = `<div style="text-align:center">
                <b>${p.name}</b><br><small>${p.wikidata}</small><br>
                <div class="logo-row">
                    <a href="https://www.wikidata.org/wiki/${p.wikidata}" target="_blank" class="logo-link" title="Wikidata">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Wikidata-logo.svg" alt="WD">
                    </a>`;
            if(p.osm_id) {
                pop += `<a href="https://www.openstreetmap.org/${p.osm_id}" target="_blank" class="logo-link" title="OSM">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Openstreetmap_logo.svg" alt="OSM">
                    </a>`;
            }
            pop += `</div></div>`;

            var color;
            if (isD) {
                color = "#2ecc71"; 
            } else {
                if (viewMode === 'categories') {
                    color = categoryColors[cat] || "#000000";
                } else {
                    color = "#e74c3c"; 
                }
            }

            L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { 
                pane: 'markersPane',
                radius: 4.5, fillColor: color, color: "#fff", weight: 1, fillOpacity: 0.8 
            }).bindPopup(pop).addTo(isD ? layers.done : layers.missing);
        });

        document.getElementById('count-missing').innerText = `(${cM})`;
        document.getElementById('count-done').innerText = `(${cD})`;
        
        if (currentMissingFeatures.length > 0) document.getElementById('btnDownload').style.display = 'block';
        else document.getElementById('btnDownload').style.display = 'none';
        
        if(document.getElementById('chkMissing').checked) map.addLayer(layers.missing);
        if(document.getElementById('chkDone').checked) map.addLayer(layers.done);
    }

    function downloadCurrentMissing() {
        if (!currentMissingFeatures.length) return;
        var suffix = activeCategoryFilters.size > 0 ? "_selection" : "_all";
        var regionName = regionConfig[selectedRegionKey].name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        downloadJSON(currentMissingFeatures, `missing_${regionName}${suffix}.geojson`);
    }

    function downloadCategory(cat) {
        if (!currentData) return;
        var feats = currentData.features.filter(f => f.properties.status === 'missing' && (f.properties.category || 'other') === cat);
        if (feats.length === 0) { alert("Nessun elemento in questa categoria"); return; }
        
        var regionName = regionConfig[selectedRegionKey].name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        downloadJSON(feats, `missing_${regionName}_${cat}.geojson`);
    }

    function downloadJSON(features, filename) {
        var blob = new Blob([JSON.stringify({ "type": "FeatureCollection", "features": features })], {type: "application/json"});
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function toggleLayer(t, c) { if(c) map.addLayer(layers[t]); else map.removeLayer(layers[t]); }
    function toggleCheckbox(id) { var c = document.getElementById(id); if(event.target !== c) { c.checked = !c.checked; c.dispatchEvent(new Event('change')); } }
</script>
</body>
</html>
