<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM-Wikidata Italia Overview</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* HEADER */
        #header { background-color: #333; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; height: 50px; z-index: 1000; position: relative; }
        #left-col { display: flex; align-items: center; gap: 10px; }
        #menu-toggle { display: none; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        #title { font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: white; white-space: nowrap; }
        
        /* CONTROLS */
        #controls { display: flex; gap: 10px; align-items: center; font-size: 12px; margin-left: auto; }
        
        /* SIDEBAR */
        #sidebar { width: 220px; background-color: #2c3e50; color: #ecf0f1; border-right: 1px solid #1a252f; flex-shrink: 0; transition: transform 0.3s ease; display: flex; flex-direction: column; height: 100%; }
        
        /* TABS NELLA SIDEBAR */
        #sidebar-tabs { display: flex; border-bottom: 1px solid #1a252f; background: #34495e; min-height: 40px; }
        .tab-btn { flex: 1; border: none; background: none; color: #bdc3c7; cursor: pointer; font-weight: bold; font-size: 13px; padding: 10px 0; }
        .tab-btn.active { color: #fff; border-bottom: 3px solid #3498db; background: #2c3e50; }
        
        #sidebar-content { flex: 1; overflow-y: auto; }

        /* MAIN LAYOUT */
        #main-container { display: flex; height: calc(100vh - 50px); width: 100%; position: relative; overflow: hidden; }
        #map { flex-grow: 1; background: #f0f0f0; height: 100%; }
        
        .list-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #34495e; transition: background 0.2s; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .list-item:hover { background-color: #34495e; }
        .list-item.active { background-color: #3498db; font-weight: bold; border-left: 4px solid #fff; }
        
        .cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 1px solid #fff; }

        .stat-item { display: none; align-items: center; gap: 4px; cursor: pointer; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
        .dot-red { background: #e74c3c; }
        .dot-green { background: #2ecc71; }
        
        .btn-download { 
            background-color: #bdc3c7; color: #333; border: 1px solid #95a5a6; 
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; 
            display: none; 
        }
        .btn-download:hover { background-color: #aab7b8; }
        
        #meta-info { font-size: 9px; color: #ccc; text-align: right; border-left: 1px solid #555; padding-left: 10px; min-width: 80px; }
        #loading { display:none; color: #f1c40f; font-weight: bold; font-size: 11px; }
        
        /* LOGOS IN POPUP */
        .logo-row { display: flex; gap: 15px; margin-top: 8px; justify-content: center; align-items: center; }
        .logo-link { display: inline-block; width: 32px; height: 32px; transition: transform 0.2s; }
        .logo-link:hover { transform: scale(1.1); }
        .logo-link img { width: 100%; height: 100%; object-fit: contain; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 700px) {
            #menu-toggle { display: block; }
            #sidebar { 
                position: absolute; left: 0; top: 0; bottom: 0; z-index: 2000; 
                transform: translateX(-100%); width: 250px; box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            }
            #sidebar.open { transform: translateX(0); }
            #title { font-size: 14px; }
            #controls { gap: 5px; }
            .stat-item span:nth-child(3) { display: none; } /* Hide text labels on small screens */
            #meta-info { display: none; } /* Hide dates on very small screens to save space */
        }
    </style>
</head>
<body>
<header id="header">
    <div id="left-col">
        <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div id="title" onclick="location.reload()">OSM-Wikidata Italia Overview</div>
    </div>
    <div id="controls">
        <div id="loading">Loading...</div>
        <button id="btnDownload" class="btn-download" onclick="downloadCurrentMissing()">Download Wikidata only</button>
        <div class="stat-item" id="stat-missing" onclick="toggleCheckbox('chkMissing')" title="Wikidata only">
            <span class="dot dot-red"></span><input type="checkbox" id="chkMissing" checked onchange="toggleLayer('missing', this.checked)"> <span>Wikidata only</span> <span id="count-missing" style="font-weight:bold"></span>
        </div>
        <div class="stat-item" id="stat-done" onclick="toggleCheckbox('chkDone')" title="Done">
            <span class="dot dot-green"></span><input type="checkbox" id="chkDone" onchange="toggleLayer('done', this.checked)"> <span>OSM+Wikidata</span> <span id="count-done" style="font-weight:bold"></span>
        </div>
        <div id="meta-info">
            <div>OSM: <span id="date-osm">--</span></div>
            <div>WD: <span id="date-wiki">--</span></div>
        </div>
    </div>
</header>
<div id="main-container">
    <div id="sidebar">
        <div id="sidebar-tabs">
            <button class="tab-btn active" onclick="switchTab('regions')">Regioni</button>
            <button class="tab-btn" onclick="switchTab('categories')">Categorie</button>
        </div>
        <div id="sidebar-content"></div>
    </div>
    <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([42.0, 12.5], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        maxZoom: 19,
        attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
    }).addTo(map);

    map.createPane('regionsPane'); map.getPane('regionsPane').style.zIndex = 400;
    map.createPane('markersPane'); map.getPane('markersPane').style.zIndex = 600;

    var layers = { missing: L.layerGroup(), done: L.layerGroup(), regions: L.layerGroup(), activeBorder: L.layerGroup() };
    var regionConfig, metaDataGlobal, boundariesGeoJSON;
    var currentMissingFeatures = [];
    var currentData = null; // Stores currently loaded region data
    var currentTab = 'regions';
    var activeCategoryFilter = null; // null = all

    var categoryColors = {
        "religion": "#9b59b6",   // Viola
        "settlement": "#3498db", // Blu
        "admin": "#f39c12",      // Arancione
        "culture": "#e67e22",    // Marrone
        "other": "#e74c3c"       // Rosso (default)
    };
    
    var categoryNames = {
        "religion": "Luoghi di Culto",
        "settlement": "Insediamenti",
        "admin": "Amministrazione",
        "culture": "Cultura/Turismo",
        "other": "Altro"
    };

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Close sidebar when clicking map on mobile
    map.on('click', function() {
        if (window.innerWidth <= 700) {
            document.getElementById('sidebar').classList.remove('open');
        }
    });

    Promise.all([
        fetch('regions.json').then(r => r.json()),
        fetch('metadata.json').then(r => r.json()).catch(() => ({})),
        fetch('regions_boundaries.geojson').then(r => r.json()).catch(() => null)
    ]).then(([regions, metadata, bounds]) => {
        regionConfig = regions; metaDataGlobal = metadata; boundariesGeoJSON = bounds;
        
        // Fix Date display
        if(metadata.global_osm_date) {
             let d = new Date(metadata.global_osm_date);
             if(!isNaN(d)) document.getElementById('date-osm').innerText = d.toLocaleString() + " CET";
             else document.getElementById('date-osm').innerText = metadata.global_osm_date;
        }
        if(metadata.global_wiki_date) {
             let d = new Date(metadata.global_wiki_date);
             if(!isNaN(d)) document.getElementById('date-wiki').innerText = d.toLocaleString() + " CET";
             else document.getElementById('date-wiki').innerText = metadata.global_wiki_date;
        }

        renderSidebar();
        if (boundariesGeoJSON) loadRegionsShape();
    });

    function getHeatColor(p) {
        if (p >= 90) return '#006400';
        if (p >= 80) return '#228B22';
        if (p >= 70) return '#32CD32';
        if (p >= 60) return '#ADFF2F';
        if (p >= 50) return '#FFFF00';
        if (p >= 40) return '#FFA500';
        if (p >= 30) return '#FF8C00';
        if (p >= 20) return '#FF4500';
        if (p >= 10) return '#FF0000';
        return '#8B0000';
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
        renderSidebar();
        
        // Se passiamo a categorie, azzeriamo il filtro (mostra tutto colorato)
        // Se torniamo a regioni, togliamo il filtro categorie
        if (tabName === 'regions') {
            activeCategoryFilter = null;
            if (currentData) renderMarkers(currentData); // Ridisegna normale
        } else {
            // Se siamo in categoria ma non c'è una regione selezionata, non succede nulla di speciale
            // Se c'è una regione, l'utente può cliccare le categorie per filtrare
        }
    }

    function renderSidebar() {
        var sb = document.getElementById('sidebar-content'); sb.innerHTML = "";
        
        if (currentTab === 'regions') {
            var sortedKeys = Object.keys(regionConfig).sort((a,b) => {
                var metaA = (metaDataGlobal.regions && metaDataGlobal.regions[a]) || {done:0, total:1};
                var metaB = (metaDataGlobal.regions && metaDataGlobal.regions[b]) || {done:0, total:1};
                var pctA = (metaA.done / metaA.total);
                var pctB = (metaB.done / metaB.total);
                if (pctB !== pctA) return pctB - pctA;
                return regionConfig[a].name.localeCompare(regionConfig[b].name);
            });

            sortedKeys.forEach(key => {
                var meta = (metaDataGlobal.regions && metaDataGlobal.regions[key]) ? metaDataGlobal.regions[key] : null;
                var pct = (meta && meta.total > 0) ? Math.round((meta.done / meta.total) * 100) : null;
                var color = pct !== null ? getHeatColor(pct) : "#fff";
                
                var div = document.createElement('div');
                div.className = "list-item"; div.id = "sb-item-" + key;
                div.innerHTML = `<span>${regionConfig[key].name}</span>` + (pct !== null ? `<span style="color:${color};font-weight:bold">${pct}%</span>` : "");
                div.onclick = () => { changeRegion(key); if(window.innerWidth<=700) toggleSidebar(); };
                sb.appendChild(div);
            });
        } else {
            // CATEGORIES TAB
            var cats = Object.keys(categoryColors);
            
            // Bottone "Tutte"
            var allDiv = document.createElement('div');
            allDiv.className = "list-item";
            if(activeCategoryFilter === null) allDiv.classList.add('active');
            allDiv.innerHTML = `<span><span class="cat-dot" style="background:#fff"></span>Tutte le Categorie</span>`;
            allDiv.onclick = () => { 
                activeCategoryFilter = null; 
                renderSidebar(); 
                if(currentData) renderMarkers(currentData); 
            };
            sb.appendChild(allDiv);

            cats.forEach(cat => {
                var div = document.createElement('div');
                div.className = "list-item";
                if(activeCategoryFilter === cat) div.classList.add('active');
                
                // Se abbiamo dati caricati, mostriamo il conteggio (opzionale, ma carino)
                var countStr = "";
                if (currentData) {
                   var c = currentData.features.filter(f => f.properties.status === 'missing' && (f.properties.category || 'other') === cat).length;
                   countStr = ` <b>(${c})</b>`;
                }

                div.innerHTML = `<span><span class="cat-dot" style="background:${categoryColors[cat]}"></span>${categoryNames[cat] || cat}</span><span>${countStr}</span>`;
                div.onclick = () => {
                    activeCategoryFilter = cat;
                    renderSidebar();
                    if(currentData) renderMarkers(currentData);
                };
                sb.appendChild(div);
            });
        }
    }

    function getKeyFromFeature(f) {
        var id = String(f.id || f.properties.id || f.properties['@id'] || "").replace("relation/", "");
        var found = Object.keys(regionConfig).find(k => String(parseInt(regionConfig[k].osm) - 3600000000) === id);
        if (found) return found;
        var name = f.properties.name || f.properties['name:en'] || "";
        if (name.includes("Sardegna") || name.includes("Sardinia")) return "sardegna";
        return null;
    }

    function loadRegionsShape() {
        L.geoJSON(boundariesGeoJSON, {
            pane: 'regionsPane',
            style: function(f) {
                var k = getKeyFromFeature(f);
                var color = "#3498db", opacity = 0.1;
                if (k && metaDataGlobal.regions && metaDataGlobal.regions[k]) {
                    var m = metaDataGlobal.regions[k];
                    if (m.total > 0) { color = getHeatColor((m.done / m.total) * 100); opacity = 0.6; }
                }
                return { color: color, weight: 1.5, fillOpacity: opacity };
            },
            onEachFeature: (f, l) => { 
                var k = getKeyFromFeature(f); 
                if (k) { 
                    l.on('click', () => changeRegion(k)); 
                    l.bindTooltip(regionConfig[k].name, {direction: "center", className: "region-label"}); 
                }
            }
        }).addTo(layers.regions);
        map.addLayer(layers.regions);
    }

    function changeRegion(key) {
        // Highlight active region in list (if in Regions tab)
        if (currentTab === 'regions') {
            document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
            if(document.getElementById("sb-item-" + key)) document.getElementById("sb-item-" + key).classList.add('active');
        }

        layers.activeBorder.clearLayers();
        var target = boundariesGeoJSON.features.find(f => getKeyFromFeature(f) === key);
        if(target) {
            var b = L.geoJSON(target, { 
                pane: 'regionsPane', 
                style: { color: "#3498db", weight: 3, fillOpacity: 0.05 } 
            }).addTo(layers.activeBorder);
            map.addLayer(layers.activeBorder); map.fitBounds(b.getBounds());
        }
        document.getElementById('loading').style.display = 'block';
        document.getElementById('btnDownload').style.display = 'none';
        
        fetch(`data_overpass/data_${key}.geojson`).then(res => res.json()).then(data => {
            currentData = data; // Store globally
            renderMarkers(data);
            
            // Refresh sidebar if Categories tab is active (to update counts)
            if (currentTab === 'categories') renderSidebar();

            document.getElementById('loading').style.display = 'none';
        });
    }

    function renderMarkers(data) {
        layers.missing.clearLayers(); layers.done.clearLayers();
        currentMissingFeatures = [];

        var cM = 0, cD = 0;
        data.features.forEach(f => {
            var isD = f.properties.status === 'done';
            
            // FILTER LOGIC
            // If activeCategoryFilter is set, we ONLY show missing items of that category
            // Done items are always shown (green) unless filtered out explicitly? 
            // Let's assume Filter only applies to Missing items coloring/visibility
            
            var cat = f.properties.category || 'other';

            if(activeCategoryFilter && !isD && cat !== activeCategoryFilter) {
                return; // Skip this marker if filter is active and doesn't match
            }

            if(isD) {
                cD++;
            } else {
                cM++;
                currentMissingFeatures.push(f);
            }

            var p = f.properties;
            var pop = `<div style="text-align:center">
                <b>${p.name}</b><br><small>${p.wikidata}</small><br>
                <small style="color:#7f8c8d">${p.type || ''}</small>
                <div class="logo-row">
                    <a href="https://www.wikidata.org/wiki/${p.wikidata}" target="_blank" class="logo-link" title="Wikidata">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Wikidata-logo.svg" alt="WD">
                    </a>`;
            if(p.osm_id) {
                pop += `<a href="https://www.openstreetmap.org/${p.osm_id}" target="_blank" class="logo-link" title="OSM">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Openstreetmap_logo.svg" alt="OSM">
                    </a>`;
            }
            pop += `</div></div>`;

            // Color Logic: Green if done, Category Color if missing
            var color = isD ? "#2ecc71" : (categoryColors[cat] || "#e74c3c");

            L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { 
                pane: 'markersPane',
                radius: 4.5, fillColor: color, color: "#fff", weight: 1, fillOpacity: 0.8 
            }).bindPopup(pop).addTo(isD ? layers.done : layers.missing);
        });

        document.getElementById('count-missing').innerText = `(${cM})`;
        document.getElementById('count-done').innerText = `(${cD})`;
        document.getElementById('stat-missing').style.display = 'flex';
        document.getElementById('stat-done').style.display = 'flex';
        
        if (currentMissingFeatures.length > 0) document.getElementById('btnDownload').style.display = 'block';
        
        if(document.getElementById('chkMissing').checked) map.addLayer(layers.missing);
        if(document.getElementById('chkDone').checked) map.addLayer(layers.done);
    }

    function downloadCurrentMissing() {
        if (!currentMissingFeatures.length) return;
        var blob = new Blob([JSON.stringify({ "type": "FeatureCollection", "features": currentMissingFeatures })], {type: "application/json"});
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "missing_items.geojson";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function toggleLayer(t, c) { if(c) map.addLayer(layers[t]); else map.removeLayer(layers[t]); }
    function toggleCheckbox(id) { var c = document.getElementById(id); if(event.target !== c) { c.checked = !c.checked; c.dispatchEvent(new Event('change')); } }
</script>
</body>
</html>
