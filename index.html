<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panoramica OpenStreetMap-Wikidata Italia</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* HEADER */
#header {
    background-color: #333;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5px;
    height: 50px;
    z-index: 3000;
    position: relative;
    flex-shrink: 0;
}

#left-col {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1;
    min-width: 0;
}

#menu-toggle {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0 5px;
}

#title {
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

#cat-toggle-btn {
    display: none;
    background: #e67e22;
    border: none;
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    margin-left: 10px;
}

#controls {
    display: none;
    gap: 8px;
    align-items: center;
    font-size: 12px;
}

#meta-info {
    font-size: 10px;
    color: #ccc;
    text-align: right;
    border-left: 1px solid #555;
    padding-left: 10px;
    min-width: 90px;
}

/* LAYOUT */
#main-container {
    display: flex;
    flex: 1;
    width: 100%;
    overflow: hidden;
}

#sidebar {
    width: 220px;
    background-color: #2c3e50;
    color: #ecf0f1;
    border-right: 1px solid #1a252f;
    display: flex;
    flex-direction: column;
}

#sidebar-content {
    flex-grow: 1;
    overflow-y: auto;
}

#sidebar-footer {
    padding: 12px;
    font-size: 10px;
    text-align: center;
    color: #7f8c8d;
    border-top: 1px solid #34495e;
    background-color: #233140;
}

#map {
    flex-grow: 1;
    height: 100%;
}

/* SIDEBAR ITEMS */
.list-item {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #34495e;
    display: flex;
    justify-content: space-between;
}

.list-item:hover {
    background-color: #34495e;
}

.group-header {
    display: flex;
    background-color: #34495e;
    border-bottom: 1px solid #2c3e50;
}

.group-header.fully-selected {
    background-color: #2980b9;
    border-left: 4px solid #fff;
}

.group-header.partially-selected {
    border-left: 4px solid #f39c12;
}

.group-label {
    flex-grow: 1;
    padding: 10px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
}

.group-toggle-icon {
    width: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.group-content {
    display: none;
}

.group-content.expanded {
    display: block;
}

.subcat-item {
    display: flex;
    border-bottom: 1px solid #34495e;
}

.subcat-item.selected {
    background-color: #2980b9;
    border-left: 4px solid #fff;
}

.subcat-label {
    flex-grow: 1;
    padding: 8px 5px 8px 15px;
    display: flex;
    align-items: center;
}

.subcat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    border: 1px solid rgba(255,255,255,0.3);
}

.cat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    border: 1px solid #fff;
}

/* MOBILE */
@media (max-width: 700px) {
    #menu-toggle { display: block; }
    #sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 2000;
        width: 250px;
    }
    #sidebar.open { transform: translateX(0); }
    #meta-info { display: none; }
}
</style>
</head>

<body>

<header id="header">
<div id="left-col">
<button id="menu-toggle" onclick="toggleSidebar()">☰</button>
<div id="title" onclick="location.reload()">Panoramica OpenStreetMap-Wikidata Italia</div>
<button id="cat-toggle-btn" onclick="location.reload()">Torna a panoramica</button>
</div>

<div id="controls">
<div id="loading">Caricamento...</div>
</div>

<div id="meta-info">
<div>OSM: <span id="date-osm">--</span></div>
<div>WD: <span id="date-wiki">--</span></div>
</div>
</header>

<div id="main-container">
<div id="sidebar">
<div id="sidebar-content"></div>
<div id="sidebar-footer">Panoramica a cura di: Michael Wild</div>
</div>
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([42.0, 12.5], 6);
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

map.createPane('regionsPane');
map.getPane('regionsPane').style.zIndex = 400;

map.createPane('markersPane');
map.getPane('markersPane').style.zIndex = 600;

var layers = {
    regions: L.layerGroup(),
    activeBorder: L.layerGroup()
};

var regionConfig, metaDataGlobal, boundariesGeoJSON;
var viewMode = 'regions';
var selectedRegionKey = null;
var expandedGroups = new Set();
var activeCategoryFilters = new Set();
var typeColorCache = {};

/* GROUP COLORS */
var groupColors = {
    "Religione": "#E63946",
    "Archeologia": "#8D6E63",
    "Cultura e tempo libero": "#FFB703",
    "Amministrazione": "#F4A261",
    "Fortificazioni e militare": "#606C38",
    "Dimore ed edifici": "#A53860",
    "Natura e paesaggio": "#2A9D8F",
    "Insediamenti": "#457B9D",
    "Infrastrutture": "#7D8597",
    "Monumenti": "#9D4EDD",
    "Altro": "#777777"
};

/* COLOR UTILS */
function hexToHSL(H) {
    let r = parseInt(H.substring(1,3),16)/255;
    let g = parseInt(H.substring(3,5),16)/255;
    let b = parseInt(H.substring(5,7),16)/255;
    let cmin = Math.min(r,g,b);
    let cmax = Math.max(r,g,b);
    let delta = cmax - cmin;
    let h = 0;
    if (delta !== 0) {
        if (cmax === r) h = ((g - b) / delta) % 6;
        else if (cmax === g) h = (b - r) / delta + 2;
        else h = (r - g) / delta + 4;
    }
    h = Math.round(h * 60);
    let l = (cmax + cmin) / 2;
    let s = delta === 0 ? 0 : delta / (1 - Math.abs(2*l - 1));
    return { h, s: s*100, l: l*100 };
}

function HSLToHex(h,s,l) {
    s/=100; l/=100;
    let c=(1-Math.abs(2*l-1))*s;
    let x=c*(1-Math.abs((h/60)%2-1));
    let m=l-c/2;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;}
    else if(h<120){r=x;g=c;}
    else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;}
    else if(h<300){r=x;b=c;}
    else{r=c;b=x;}
    return "#"+[r,g,b].map(v=>{
        v=Math.round((v+m)*255).toString(16);
        return v.length===1?"0"+v:v;
    }).join("");
}

function generateVariant(baseHex, seed) {
    if(typeColorCache[seed]) return typeColorCache[seed];
    let hash = 0;
    for(let i=0;i<seed.length;i++) hash = seed.charCodeAt(i) + ((hash<<5)-hash);
    let hsl = hexToHSL(baseHex);
    let newH = (hsl.h + (hash%120 - 60) + 360) % 360;
    let newL = Math.max(35, Math.min(70, hsl.l + (hash%40 - 20)));
    let col = HSLToHex(newH, hsl.s, newL);
    typeColorCache[seed] = col;
    return col;
}

/* LOAD DATA */
Promise.all([
    fetch('regions.json').then(r=>r.json()),
    fetch('metadata.json').then(r=>r.json()).catch(()=>({})),
    fetch('regions_boundaries.geojson').then(r=>r.json()).catch(()=>null)
]).then(([regions, meta, bounds])=>{
    regionConfig = regions;
    metaDataGlobal = meta;
    boundariesGeoJSON = bounds;
    renderSidebar();
    if(bounds) loadRegionsShape();
});

/* HEATMAP COLOR */
function getHeatColor(p) {
    if(p>=90) return '#006400';
    if(p>=80) return '#228B22';
    if(p>=70) return '#32CD32';
    if(p>=60) return '#ADFF2F';
    if(p>=50) return '#FFFF00';
    if(p>=40) return '#FFA500';
    if(p>=30) return '#FF8C00';
    if(p>=20) return '#FF4500';
    if(p>=10) return '#FF0000';
    return '#8B0000';
}

/* REGION STYLE */
function regionStyle(f) {
    let k = getKeyFromFeature(f);
    let m = metaDataGlobal.regions?.[k] || {done:0,total:1};
    let pct = (m.done/m.total)*100;
    let c = getHeatColor(pct);
    return { color:c, fillColor:c, weight:1.5, fillOpacity:0.6 };
}

function getKeyFromFeature(f) {
    let id = String(f.id||"").replace("relation/","");
    return Object.keys(regionConfig).find(k => String(parseInt(regionConfig[k].osm)-3600000000)===id);
}

/* REGIONS */
function loadRegionsShape() {
    L.geoJSON(boundariesGeoJSON,{
        pane:'regionsPane',
        style:regionStyle,
        onEachFeature:(f,l)=>{
            let k=getKeyFromFeature(f);
            if(!k) return;
            l.on({
                mouseover:e=>{ if(viewMode==='regions') e.target.setStyle({weight:3,color:'#55AAFF'}); },
                mouseout:e=>{ if(viewMode==='regions') layers.regions.resetStyle(e.target); },
                click:e=>{
                    L.DomEvent.stopPropagation(e);
                    changeRegion(k);
                }
            });
            l.bindTooltip(regionConfig[k].name,{direction:"center"});
        }
    }).addTo(layers.regions);
    map.addLayer(layers.regions);
}

/* SIDEBAR */
function renderSidebar() {
    let sb=document.getElementById('sidebar-content');
    sb.innerHTML="";
    Object.keys(regionConfig).forEach(k=>{
        let m=metaDataGlobal.regions?.[k]||{done:0,total:1};
        let pct=Math.round((m.done/m.total)*100);
        let div=document.createElement('div');
        div.className="list-item";
        div.innerHTML=`<span>${regionConfig[k].name}</span><span style="color:${getHeatColor(pct)}">${pct}%</span>`;
        div.onclick=()=>changeRegion(k);
        sb.appendChild(div);
    });
}

/* REGION SELECT */
function changeRegion(key) {
    viewMode='categories';
    selectedRegionKey=key;
    layers.activeBorder.clearLayers();
    let f=boundariesGeoJSON.features.find(x=>getKeyFromFeature(x)===key);
    if(f){
        L.geoJSON(f,{
            pane:'regionsPane',
            style:{color:"#0044ff",weight:3,fillOpacity:0,interactive:false}
        }).addTo(layers.activeBorder);
        map.fitBounds(L.geoJSON(f).getBounds());
    }
}

/* UI */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
</script>

</body>
</html>
