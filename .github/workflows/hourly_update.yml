name: Update Overpass Data

on:
  schedule:

    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:

    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install requests geojson
        
    - name: Run update script
      run: python update_data.py
      
    - name: Commit and push if changed
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add data_overpass/*.geojson
        # Nur committen, wenn sich wirklich was geändert hat
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data from Overpass" && git push)
