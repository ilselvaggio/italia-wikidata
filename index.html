<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM-Wikidata Italia Overview</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* HEADER */
        #header { background-color: #333; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; height: 50px; z-index: 1000; position: relative; }
        #left-col { display: flex; align-items: center; gap: 10px; }
        #menu-toggle { display: none; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        #title { font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; color: white; white-space: nowrap; }
        
        /* CONTROLS */
        #controls { display: flex; gap: 10px; align-items: center; font-size: 12px; margin-left: auto; }
        
        /* SIDEBAR */
        #sidebar { width: 220px; background-color: #2c3e50; color: #ecf0f1; overflow-y: auto; border-right: 1px solid #1a252f; flex-shrink: 0; transition: transform 0.3s ease; }
        
        /* MOBILE HINT (Standardmäßig aus) */
        .mobile-hint { display: none; background-color: #233140; padding: 12px; text-align: center; color: #bdc3c7; font-weight: bold; border-bottom: 1px solid #1a252f; font-size: 13px; }

        /* MAIN LAYOUT */
        #main-container { display: flex; height: calc(100% - 50px); width: 100%; position: relative; }
        #map { flex-grow: 1; background: #f0f0f0; height: 100%; }
        
        .region-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #34495e; transition: background 0.2s; font-size: 13px; display: flex; justify-content: space-between; }
        .region-item:hover { background-color: #34495e; }
        .region-item.active { background-color: #3498db; font-weight: bold; border-left: 4px solid #fff; }
        
        .stat-item { display: none; align-items: center; gap: 4px; cursor: pointer; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
        .dot-red { background: #e74c3c; }
        .dot-green { background: #2ecc71; }
        
        .btn-download { 
            background-color: #bdc3c7; color: #333; border: 1px solid #95a5a6; 
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; 
            display: none; 
        }
        .btn-download:hover { background-color: #aab7b8; }
        
        #meta-info { font-size: 9px; color: #ccc; text-align: right; border-left: 1px solid #555; padding-left: 10px; min-width: 80px; }
        #loading { display:none; color: #f1c40f; font-weight: bold; font-size: 11px; }
        
        /* LOGOS IN POPUP */
        .logo-row { display: flex; gap: 15px; margin-top: 8px; justify-content: center; align-items: center; }
        .logo-link { display: inline-block; width: 32px; height: 32px; transition: transform 0.2s; }
        .logo-link:hover { transform: scale(1.1); }
        .logo-link img { width: 100%; height: 100%; object-fit: contain; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 700px) {
            #menu-toggle { display: block; }
            #sidebar { 
                position: absolute; left: 0; top: 0; bottom: 0; z-index: 2000; 
                transform: translateX(-100%); width: 250px; box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            }
            #sidebar.open { transform: translateX(0); }
            #title { font-size: 14px; }
            #controls { gap: 5px; }
            .stat-item span:nth-child(3) { display: none; }
            #meta-info { display: none; }
            
            /* Zeige Hinweis nur auf Mobile */
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body>
<header id="header">
    <div id="left-col">
        <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div id="title" onclick="location.reload()">OSM-Wikidata Italia</div>
    </div>
    <div id="controls">
        <div id="loading">Loading...</div>
        <button id="btnDownload" class="btn-download" onclick="downloadCurrentMissing()">Download Wikidata only</button>
        <div class="stat-item" id="stat-missing" onclick="toggleCheckbox('chkMissing')" title="Wikidata only">
            <span class="dot dot-red"></span><input type="checkbox" id="chkMissing" checked onchange="toggleLayer('missing', this.checked)"> <span>Wikidata only</span> <span id="count-missing" style="font-weight:bold"></span>
        </div>
        <div class="stat-item" id="stat-done" onclick="toggleCheckbox('chkDone')" title="Done">
            <span class="dot dot-green"></span><input type="checkbox" id="chkDone" onchange="toggleLayer('done', this.checked)"> <span>OSM+Wikidata</span> <span id="count-done" style="font-weight:bold"></span>
        </div>
        <div id="meta-info">
            <div>OSM: <span id="date-osm">--</span></div>
            <div>Wikidata: <span id="date-wiki">--</span></div>
        </div>
    </div>
</header>
<div id="main-container">
    <div id="sidebar"></div>
    <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([42.0, 12.5], 6);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        maxZoom: 19,
        attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
    }).addTo(map);

    map.createPane('regionsPane'); map.getPane('regionsPane').style.zIndex = 400;
    map.createPane('markersPane'); map.getPane('markersPane').style.zIndex = 600;

    var layers = { missing: L.layerGroup(), done: L.layerGroup(), regions: L.layerGroup(), activeBorder: L.layerGroup() };
    var regionConfig, metaDataGlobal, boundariesGeoJSON;
    var currentMissingFeatures = [];

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    map.on('click', function() {
        if (window.innerWidth <= 700) {
            document.getElementById('sidebar').classList.remove('open');
        }
    });

    Promise.all([
        fetch('regions.json').then(r => r.json()),
        fetch('metadata.json').then(r => r.json()).catch(() => ({})),
        fetch('regions_boundaries.geojson').then(r => r.json()).catch(() => null)
    ]).then(([regions, metadata, bounds]) => {
        regionConfig = regions; metaDataGlobal = metadata; boundariesGeoJSON = bounds;
        if(metadata.global_osm_date) document.getElementById('date-osm').innerText = new Date(metadata.global_osm_date).toLocaleString();
        if(metadata.global_wiki_date) document.getElementById('date-wiki').innerText = new Date(metadata.global_wiki_date).toLocaleString();
        initNavigation();
        if (boundariesGeoJSON) loadRegionsShape();
    });

    function getHeatColor(p) {
        if (p >= 90) return '#006400';
        if (p >= 80) return '#228B22';
        if (p >= 70) return '#32CD32';
        if (p >= 60) return '#ADFF2F';
        if (p >= 50) return '#FFFF00';
        if (p >= 40) return '#FFA500';
        if (p >= 30) return '#FF8C00';
        if (p >= 20) return '#FF4500';
        if (p >= 10) return '#FF0000';
        return '#8B0000';
    }

    function initNavigation() {
        var sb = document.getElementById('sidebar'); sb.innerHTML = "";
        
        // Mobile Hint einfuegen
        var hint = document.createElement('div');
        hint.className = "mobile-hint";
        hint.innerText = "Seleziona una regione";
        sb.appendChild(hint);

        var sortedKeys = Object.keys(regionConfig).sort((a,b) => {
            var metaA = (metaDataGlobal.regions && metaDataGlobal.regions[a]) || {done:0, total:1};
            var metaB = (metaDataGlobal.regions && metaDataGlobal.regions[b]) || {done:0, total:1};
            var pctA = (metaA.done / metaA.total);
            var pctB = (metaB.done / metaB.total);
            if (pctB !== pctA) return pctB - pctA;
            return regionConfig[a].name.localeCompare(regionConfig[b].name);
        });

        sortedKeys.forEach(key => {
            var meta = (metaDataGlobal.regions && metaDataGlobal.regions[key]) ? metaDataGlobal.regions[key] : null;
            var pct = (meta && meta.total > 0) ? Math.round((meta.done / meta.total) * 100) : null;
            var color = pct !== null ? getHeatColor(pct) : "#fff";
            
            var div = document.createElement('div');
            div.className = "region-item"; div.id = "sb-item-" + key;
            div.innerHTML = `<span>${regionConfig[key].name}</span>` + (pct !== null ? `<span style="color:${color};font-weight:bold">${pct}%</span>` : "");
            div.onclick = () => { changeRegion(key); if(window.innerWidth<=700) toggleSidebar(); };
            sb.appendChild(div);
        });
    }

    function getKeyFromFeature(f) {
        // 1. ID Check (OSM ID oder Relation ID)
        var featId = String(f.id || f.properties.id || f.properties['@id'] || f.properties.osm_id || "").replace("relation/", "");
        var idMatch = Object.keys(regionConfig).find(k => {
            var configOsm = String(regionConfig[k].osm);
            // Prueft exakte ID oder die Subtraktions-Logik
            return configOsm === featId || String(parseInt(configOsm) - 3600000000) === featId;
        });
        if (idMatch) return idMatch;

        // 2. Fallback: Name Check (unscharf)
        var name = (f.properties.name || f.properties['name:en'] || f.properties['name:it'] || "").toLowerCase();
        return Object.keys(regionConfig).find(k => {
            var configName = (regionConfig[k].name || "").toLowerCase();
            return name && configName && (name.includes(configName) || configName.includes(name));
        });
    }

    function loadRegionsShape() {
        L.geoJSON(boundariesGeoJSON, {
            pane: 'regionsPane',
            style: function(f) {
                var k = getKeyFromFeature(f);
                var color = "#3498db", opacity = 0.1;
                if (k && metaDataGlobal.regions && metaDataGlobal.regions[k]) {
                    var m = metaDataGlobal.regions[k];
                    if (m.total > 0) { color = getHeatColor((m.done / m.total) * 100); opacity = 0.6; }
                }
                return { color: color, weight: 1.5, fillOpacity: opacity };
            },
            onEachFeature: (f, l) => { 
                var k = getKeyFromFeature(f); 
                if (k) { 
                    l.on('click', () => changeRegion(k)); 
                    l.bindTooltip(regionConfig[k].name, {direction: "center", className: "region-label"}); 
                }
            }
        }).addTo(layers.regions);
        map.addLayer(layers.regions);
    }

    function changeRegion(key) {
        document.querySelectorAll('.region-item').forEach(el => el.classList.remove('active'));
        if(document.getElementById("sb-item-" + key)) document.getElementById("sb-item-" + key).classList.add('active');
        layers.activeBorder.clearLayers();
        
        var target = boundariesGeoJSON.features.find(f => getKeyFromFeature(f) === key);
        if(target) {
            var b = L.geoJSON(target, { 
                pane: 'regionsPane', 
                style: { color: "#3498db", weight: 3, fillOpacity: 0.05 } 
            }).addTo(layers.activeBorder);
            map.addLayer(layers.activeBorder); map.fitBounds(b.getBounds());
        }
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('btnDownload').style.display = 'none';
        layers.missing.clearLayers(); layers.done.clearLayers();
        currentMissingFeatures = [];

        fetch(`data_overpass/data_${key}.geojson`).then(res => res.json()).then(data => {
            var cM = 0, cD = 0;
            data.features.forEach(f => {
                var isD = f.properties.status === 'done';
                if(isD) cD++; else { cM++; currentMissingFeatures.push(f); }
                var p = f.properties;
                var pop = `<div style="text-align:center">
                    <b>${p.name}</b><br><small>${p.wikidata}</small>
                    <div class="logo-row">
                        <a href="https://www.wikidata.org/wiki/${p.wikidata}" target="_blank" class="logo-link" title="Wikidata">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Wikidata-logo.svg" alt="WD">
                        </a>`;
                if(p.osm_id) {
                    pop += `<a href="https://www.openstreetmap.org/${p.osm_id}" target="_blank" class="logo-link" title="OSM">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Openstreetmap_logo.svg" alt="OSM">
                        </a>`;
                }
                pop += `</div></div>`;

                L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], { 
                    pane: 'markersPane',
                    radius: 4.5, fillColor: isD ? "#2ecc71" : "#e74c3c", color: "#fff", weight: 1, fillOpacity: 0.8 
                }).bindPopup(pop).addTo(isD ? layers.done : layers.missing);
            });
            document.getElementById('count-missing').innerText = `(${cM})`;
            document.getElementById('count-done').innerText = `(${cD})`;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('stat-missing').style.display = 'flex';
            document.getElementById('stat-done').style.display = 'flex';
            if (cM > 0) document.getElementById('btnDownload').style.display = 'block';
            if(document.getElementById('chkMissing').checked) map.addLayer(layers.missing);
            if(document.getElementById('chkDone').checked) map.addLayer(layers.done);
        });
    }

    function downloadCurrentMissing() {
        if (!currentMissingFeatures.length) return;
        var blob = new Blob([JSON.stringify({ "type": "FeatureCollection", "features": currentMissingFeatures })], {type: "application/json"});
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "missing_items.geojson";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    function toggleLayer(t, c) { if(c) map.addLayer(layers[t]); else map.removeLayer(layers[t]); }
    function toggleCheckbox(id) { var c = document.getElementById(id); if(event.target !== c) { c.checked = !c.checked; c.dispatchEvent(new Event('change')); } }
</script>
</body>
</html>
